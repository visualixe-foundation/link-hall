name: Check dead links

on:
  schedule:
    # 1st of every month at 09:00 UTC
    - cron: "0 9 1 * *"
  workflow_dispatch: # allow manual runs

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract URLs from sites.ts
        id: urls
        run: |
          python3 << 'PY'
          import re, json
          text = open("src/data/sites.ts").read()
          urls = re.findall(r'url:\s*"(https?://[^"]+)"', text)
          seen = set()
          unique = []
          for u in urls:
              if u not in seen:
                  seen.add(u)
                  unique.append(u)
          open("/tmp/urls.json", "w").write(json.dumps(unique))
          print(f"Found {len(unique)} unique URLs")
          PY

      - name: Check each URL
        id: check
        run: |
          python3 << 'PY'
          import json, urllib.request, urllib.error, ssl, time, os

          urls = json.load(open("/tmp/urls.json"))
          ctx = ssl.create_default_context()
          broken = []

          for i, url in enumerate(urls):
              ok = False
              err = None
              for method in ("HEAD", "GET"):
                  try:
                      req = urllib.request.Request(
                          url,
                          method=method,
                          headers={"User-Agent": "LinkHall-DeadLinkCheck/1.0"},
                      )
                      with urllib.request.urlopen(req, timeout=12, context=ctx) as resp:
                          code = resp.getcode()
                          if code < 400:
                              ok = True
                              break
                          err = f"HTTP {code}"
                  except Exception as e:
                      err = str(e)[:120]
              if not ok:
                  broken.append({"url": url, "error": err or "unknown"})
              if (i + 1) % 10 == 0:
                  print(f"Checked {i+1}/{len(urls)}")
              time.sleep(0.3)

          open("/tmp/broken.json", "w").write(json.dumps(broken, indent=2))
          print(f"Broken: {len(broken)}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"broken_count={len(broken)}\n")
          PY

      - name: Create or update issue if broken links found
        if: steps.check.outputs.broken_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const broken = JSON.parse(fs.readFileSync('/tmp/broken.json', 'utf8'));
            if (!broken.length) return;

            const body = [
              '## Dead / unreachable links',
              '',
              `Automated check found **${broken.length}** problem(s) on ${new Date().toISOString().slice(0, 10)}.`,
              '',
              '| URL | Error |',
              '|-----|-------|',
              ...broken.map(b => `| ${b.url} | \`${b.error.replace(/\|/g, '/')}\` |`),
              '',
              '_Run manually via Actions → Check dead links → Run workflow._',
            ].join('\n');

            const title = 'Dead links detected';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dead-links',
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              console.log('Updated issue', existing.number);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['dead-links'],
              });
              console.log('Created issue');
            }
